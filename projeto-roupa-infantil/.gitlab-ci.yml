stages:
  - security-scan
  - test
  - build
  - security-test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_pass

# Security Scanning Stage
sast-scan:
  stage: security-scan
  image: python:3.11
  script:
    - pip install bandit safety semgrep
    - bandit -r . -f json -o bandit-report.json || true
    - safety check --json --output safety-report.json || true
    - semgrep --config=auto --json --output=semgrep-report.json . || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week

secret-detection:
  stage: security-scan
  image: alpine/git
  script:
    - apk add --no-cache wget
    - wget -O truffleHog https://github.com/trufflesecurity/trufflehog/releases/download/v3.46.3/trufflehog_3.46.3_linux_amd64.tar.gz
    - tar -xzf trufflehog_3.46.3_linux_amd64.tar.gz
    - ./truffleHog git file://. --json > secrets-report.json || true
  artifacts:
    paths:
      - secrets-report.json
    expire_in: 1 week

# Testing Stage
unit-tests:
  stage: test
  image: python:3.11
  services:
    - postgres:13
  variables:
    DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/test_db
  before_script:
    - cd auth-service
    - pip install -r requirements.txt
    - python manage.py migrate
  script:
    - python manage.py test
    - coverage run --source='.' manage.py test
    - coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: auth-service/coverage.xml
    expire_in: 1 week

integration-tests:
  stage: test
  image: docker/compose:latest
  services:
    - docker:dind
  before_script:
    - docker-compose -f docker-compose.test.yml up -d
    - sleep 30  # Wait for services to be ready
  script:
    - docker-compose -f docker-compose.test.yml exec -T test-runner pytest tests/integration/
  after_script:
    - docker-compose -f docker-compose.test.yml down

# Build Stage
build-auth-service:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd auth-service
    - docker build -t $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA

build-task-service:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd task-service
    - docker build -t $CI_REGISTRY_IMAGE/task-service:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE/task-service:$CI_COMMIT_SHA

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA

# Security Testing Stage
container-scanning:
  stage: security-test
  image: aquasec/trivy:latest
  script:
    - trivy image --format json --output trivy-auth-report.json $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA
    - trivy image --format json --output trivy-task-report.json $CI_REGISTRY_IMAGE/task-service:$CI_COMMIT_SHA
    - trivy image --format json --output trivy-frontend-report.json $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA
  artifacts:
    reports:
      container_scanning: trivy-auth-report.json
    paths:
      - trivy-*-report.json
    expire_in: 1 week
  allow_failure: true

dast-scan:
  stage: security-test
  image: owasp/zap2docker-stable
  services:
    - docker:dind
  variables:
    DAST_WEBSITE: https://staging.example.com
  before_script:
    - mkdir /zap/wrk/
  script:
    - zap-baseline.py -t $DAST_WEBSITE -J zap-report.json -r zap-report.html
  artifacts:
    reports:
      dast: zap-report.json
    paths:
      - zap-report.html
    expire_in: 1 week
  allow_failure: true

# Deployment Stage
deploy-staging:
  stage: deploy
  image: alpine/helm:latest
  before_script:
    - apk add --no-cache kubectl
    - kubectl config use-context staging
  script:
    - helm upgrade --install superdevsecops ./k8s/helm-chart 
      --set image.auth.tag=$CI_COMMIT_SHA
      --set image.task.tag=$CI_COMMIT_SHA
      --set image.frontend.tag=$CI_COMMIT_SHA
      --namespace staging
  environment:
    name: staging
    url: https://staging.superdevsecops.com
  only:
    - develop

deploy-production:
  stage: deploy
  image: alpine/helm:latest
  before_script:
    - apk add --no-cache kubectl
    - kubectl config use-context production
  script:
    - helm upgrade --install superdevsecops ./k8s/helm-chart 
      --set image.auth.tag=$CI_COMMIT_SHA
      --set image.task.tag=$CI_COMMIT_SHA
      --set image.frontend.tag=$CI_COMMIT_SHA
      --namespace production
  environment:
    name: production
    url: https://superdevsecops.com
  when: manual
  only:
    - main