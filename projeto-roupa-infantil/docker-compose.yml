version: '3.8'

services:
  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api-gateway/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - task-service
    networks:
      - frontend
      - backend

  # Frontend
  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - REACT_APP_API_URL=https://localhost/api
    networks:
      - frontend

  # Authentication Service
  auth-service:
    build: ./auth-service
    environment:
      - DATABASE_URL=postgresql://auth_user:auth_pass@auth-db:5432/authdb
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - auth-db
      - redis
    networks:
      - backend
    volumes:
      - ./logs/auth:/app/logs

  # Task Service
  task-service:
    build: ./task-service
    environment:
      - DATABASE_URL=postgresql://task_user:task_pass@task-db:5432/taskdb
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      - task-db
    networks:
      - backend
    volumes:
      - ./logs/tasks:/app/logs

  # User Database
  auth-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_pass
    volumes:
      - auth_data:/var/lib/postgresql/data
      - ./database/users/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # Task Database
  task-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=task_user
      - POSTGRES_PASSWORD=task_pass
    volumes:
      - task_data:/var/lib/postgresql/data
      - ./database/tasks/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # Redis for session management
  redis:
    image: redis:7-alpine
    networks:
      - backend

  # ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - monitoring

  logstash:
    image: docker.elastic.co/logstash/logstash:8.6.0
    volumes:
      - ./monitoring/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - monitoring
      - backend

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring

  # Prometheus & Grafana
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

volumes:
  auth_data:
  task_data:
  elasticsearch_data:
  grafana_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge