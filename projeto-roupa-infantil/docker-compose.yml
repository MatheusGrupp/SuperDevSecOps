version: '3.8'

services:
  # Frontend
  frontend:
    build: ./frontend
    container_name: superdevsecops-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security/certificates:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - frontend-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: superdevsecops-gateway
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=gateway.settings
      - DATABASE_URL=postgresql://gateway_user:${DB_PASSWORD}@gateway-db:5432/gateway_db
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TASK_SERVICE_URL=http://task-service:8002
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${GATEWAY_SECRET_KEY}
    depends_on:
      - gateway-db
      - redis
      - auth-service
      - task-service
    volumes:
      - ./api-gateway:/app
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped

  # Serviço de Autenticação
  auth-service:
    build: ./auth-service
    container_name: superdevsecops-auth
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=auth_service.settings
      - DATABASE_URL=postgresql://auth_user:${DB_PASSWORD}@auth-db:5432/auth_db
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${AUTH_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - auth-db
      - redis
    volumes:
      - ./auth-service:/app
    networks:
      - backend-network
    restart: unless-stopped

  # Serviço de Tarefas
  task-service:
    build: ./task-service
    container_name: superdevsecops-tasks
    ports:
      - "8002:8002"
    environment:
      - DJANGO_SETTINGS_MODULE=task_service.settings
      - DATABASE_URL=postgresql://task_user:${DB_PASSWORD}@task-db:5432/task_db
      - REDIS_URL=redis://redis:6379/2
      - SECRET_KEY=${TASK_SECRET_KEY}
    depends_on:
      - task-db
      - redis
    volumes:
      - ./task-service:/app
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Autenticação
  auth-db:
    image: postgres:15-alpine
    container_name: superdevsecops-auth-db
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./databases/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Tarefas
  task-db:
    image: postgres:15-alpine
    container_name: superdevsecops-task-db
    environment:
      - POSTGRES_DB=task_db
      - POSTGRES_USER=task_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - task-db-data:/var/lib/postgresql/data
      - ./databases/task-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Gateway
  gateway-db:
    image: postgres:15-alpine
    container_name: superdevsecops-gateway-db
    environment:
      - POSTGRES_DB=gateway_db
      - POSTGRES_USER=gateway_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: superdevsecops-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: superdevsecops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: superdevsecops-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  auth-db-data:
  task-db-data:
  gateway-db-data:
  redis-data:
  prometheus-data:
  grafana-data: