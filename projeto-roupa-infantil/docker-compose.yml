version: '3.8'

services:
  # Frontend - Servindo suas páginas existentes
  frontend:
    image: nginx:alpine
    container_name: superdevsecops-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - frontend-network
    restart: unless-stopped

  # API Gateway - Django
  api-gateway:
    build: ./api-gateway
    container_name: superdevsecops-gateway
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=gateway.settings
      - SECRET_KEY=${GATEWAY_SECRET_KEY}
      - DATABASE_URL=postgresql://gateway:${DB_PASSWORD}@gateway-db:5432/gateway_db
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TASK_SERVICE_URL=http://task-service:8002
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - gateway-db
      - redis
    volumes:
      - ./api-gateway:/app
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped

  # Serviço de Autenticação - Django
  auth-service:
    build: ./auth-service
    container_name: superdevsecops-auth
    environment:
      - DJANGO_SETTINGS_MODULE=auth_service.settings
      - SECRET_KEY=${AUTH_SECRET_KEY}
      - DATABASE_URL=postgresql://auth:${DB_PASSWORD}@auth-db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - auth-db
      - redis
    volumes:
      - ./auth-service:/app
    networks:
      - backend-network
    restart: unless-stopped

  # Serviço de Tarefas - Django
  task-service:
    build: ./task-service
    container_name: superdevsecops-tasks
    environment:
      - DJANGO_SETTINGS_MODULE=task_service.settings
      - SECRET_KEY=${TASK_SECRET_KEY}
      - DATABASE_URL=postgresql://task:${DB_PASSWORD}@task-db:5432/task_db
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      - task-db
      - redis
    volumes:
      - ./task-service:/app
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Autenticação
  auth-db:
    image: postgres:15-alpine
    container_name: superdevsecops-auth-db
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Tarefas
  task-db:
    image: postgres:15-alpine
    container_name: superdevsecops-task-db
    environment:
      - POSTGRES_DB=task_db
      - POSTGRES_USER=task
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - task-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  # Banco de Dados - Gateway
  gateway-db:
    image: postgres:15-alpine
    container_name: superdevsecops-gateway-db
    environment:
      - POSTGRES_DB=gateway_db
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  # Redis - Cache e Sessões
  redis:
    image: redis:7-alpine
    container_name: superdevsecops-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    restart: unless-stopped

  # Prometheus - Monitoramento
  prometheus:
    image: prom/prometheus:latest
    container_name: superdevsecops-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    restart: unless-stopped

  # Grafana - Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: superdevsecops-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  auth-db-data:
  task-db-data:
  gateway-db-data:
  redis-data:
  prometheus-data:
  grafana-data: