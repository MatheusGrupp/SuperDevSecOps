input {
  tcp {
    port => 5000
    codec => json
  }
  
  beats {
    port => 5044
  }
  
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
    
    mutate {
      remove_field => ["message"]
    }
  }
  
  # Parse nginx access logs
  if [source] =~ /nginx/ {
    grok {
      match => {
        "message" => "%{IPORHOST:remote_ip} - %{DATA:user_name} \[%{HTTPDATE:access_time}\] \"%{WORD:http_method} %{DATA:url} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:body_sent_bytes} \"%{DATA:referrer}\" \"%{DATA:user_agent}\""
      }
    }
    
    date {
      match => ["access_time", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
    
    geoip {
      source => "remote_ip"
      target => "geoip"
    }
  }
  
  # Add service name based on container
  if [container_name] {
    mutate {
      add_field => {
        "service" => "%{container_name}"
      }
    }
  }
  
  # Security event detection
  if [parsed][event_type] == "failed_login" {
    mutate {
      add_tag => ["security", "authentication"]
      add_field => {
        "alert_severity" => "medium"
      }
    }
  }
  
  if [parsed][event_type] == "unauthorized_access" {
    mutate {
      add_tag => ["security", "authorization"]
      add_field => {
        "alert_severity" => "high"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "superdevsecops-%{+YYYY.MM.dd}"
  }
  
  # Send security alerts to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "security-alerts-%{+YYYY.MM.dd}"
    }
  }
  
  # Output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}