groups:
  # Alertas de Aplicação
  - name: application_alerts
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(django_http_requests_latency_seconds_bucket[5m])) by (le, method, view)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
          service: "{{ $labels.view }}"
        annotations:
          summary: "Alta latência detectada"
          description: "O endpoint {{ $labels.method }} {{ $labels.view }} está com latência P95 > 2s"
          runbook_url: "https://wiki.superdevsecops.com/runbooks/high-latency"

      - alert: HighErrorRate
        expr: |
          sum(rate(django_http_responses_total{status=~"5.."}[5m])) by (method, view)
          /
          sum(rate(django_http_responses_total[5m])) by (method, view)
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Taxa de erro alta"
          description: "Taxa de erro > 5% no endpoint {{ $labels.method }} {{ $labels.view }}"

      - alert: ServiceDown
        expr: up{job=~"auth-service|task-service|api-gateway"} == 0
        for: 2m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Serviço não está respondendo"
          description: "O serviço {{ $labels.job }} está down"

  # Alertas de Segurança
  - name: security_alerts
    interval: 30s
    rules:
      - alert: TooManyFailedLogins
        expr: |
          sum(rate(auth_failed_login_attempts_total[5m])) by (source_ip) > 10
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Muitas tentativas de login falhadas"
          description: "IP {{ $labels.source_ip }} teve mais de 10 tentativas falhadas em 5 minutos"

      - alert: SuspiciousActivity
        expr: |
          sum(rate(security_suspicious_activity_total[5m])) > 5
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Atividade suspeita detectada"
          description: "Múltiplas atividades suspeitas detectadas no sistema"

      - alert: UnauthorizedAccessAttempts
        expr: |
          sum(rate(django_http_responses_total{status="403"}[5m])) > 20
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Tentativas de acesso não autorizado"
          description: "Mais de 20 tentativas de acesso negado em 5 minutos"

  # Alertas de Infraestrutura
  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Alto uso de CPU"
          description: "Processo {{ $labels.job }} está usando mais de 80% de CPU"

      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes / 1024 / 1024) > 1024
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Alto uso de memória"
          description: "Processo {{ $labels.job }} está usando mais de 1GB de RAM"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 10m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Pouco espaço em disco"
          description: "Menos de 15% de espaço livre no disco"

  # Alertas de Banco de Dados
  - name: database_alerts
    interval: 30s
    rules:
      - alert: DatabaseConnectionsHigh
        expr: |
          django_db_connections_active / django_db_connections_limit > 0.8
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Muitas conexões de banco"
          description: "Usando mais de 80% das conexões disponíveis"

      - alert: DatabaseSlowQueries
        expr: |
          rate(django_db_query_duration_seconds_sum[5m]) / rate(django_db_query_duration_seconds_count[5m]) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Queries lentas no banco"
          description: "Tempo médio de query superior a 1 segundo"

  # Alertas de Negócio
  - name: business_alerts
    interval: 30s
    rules:
      - alert: LowUserActivity
        expr: |
          rate(business_user_logins_total[1h]) < 10
        for: 30m
        labels:
          severity: info
          team: product
        annotations:
          summary: "Baixa atividade de usuários"
          description: "Menos de 10 logins por hora"

      - alert: HighTaskCreationRate
        expr: |
          rate(business_tasks_created_total[5m]) > 100
        for: 5m
        labels:
          severity: info
          team: product
        annotations:
          summary: "Alta taxa de criação de tarefas"
          description: "Mais de 100 tarefas criadas em 5 minutos"